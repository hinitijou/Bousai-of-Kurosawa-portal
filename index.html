<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>家族の防災ポータル</title>
   <link rel="stylesheet" href="/Bousai-of-Kurosawa-portal/css/style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header class="app-header">
        <h1>🛡️ 家族の防災ポータル</h1>
        <p>いざという時、毎日の備えに</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="app-container">

        <!-- 今週のイチオシ情報 -->
        <section id="recommend-section" class="card highlight-card">
            <span class="badge">今週のイチオシ情報</span>
            <h2 id="recommend-title">読み込み中...</h2>
            <p id="recommend-summary">読み込み中...</p>
            <button id="recommend-btn" class="btn-primary">くわしく見る</button>
        </section>

        <!-- 防災を知る（カテゴリー検索＆リスト） -->
        <section class="card">
            <h2>📚 防災を知る</h2>
            
            <!-- カテゴリーフィルターボタン -->
            <div class="category-filters" id="category-filters">
                <button class="filter-btn active" data-category="すべて">すべて</button>
                <button class="filter-btn" data-category="災害を知る">災害を知る</button>
                <button class="filter-btn" data-category="家の中の防災">家の中の防災</button>
                <button class="filter-btn" data-category="防災用品">防災用品</button>
                <button class="filter-btn" data-category="食べる・暮らす防災">食べる・暮らす防災</button>
                <button class="filter-btn" data-category="防災雑学">防災雑学</button>
            </div>

            <!-- 記事一覧 -->
            <div id="articles-list" class="articles-grid">
                <!-- JavaScriptで動的生成 -->
            </div>
        </section>

    </main>

    <!-- フッター（常駐クイックアクセス） -->
    <nav class="quick-access-footer">
        <button class="qa-btn" id="qa-line">
            <span>💬</span>家族LINE
        </button>
        <button class="qa-btn" id="qa-jma">
            <span>⚠️</span>気象庁
        </button>
        <button class="qa-btn" id="qa-yokohama">
            <span>🏙️</span>横浜防災
        </button>
        <button class="qa-btn" id="qa-vacan">
            <span>📍</span>避難所
        </button>
        <button class="qa-btn" id="qa-hazard">
            <span>🗺️</span>ハザード
        </button>
    </nav>

    <!-- 詳細モーダル -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modal-close">&times;</span>
            <span id="modal-category" class="badge"></span>
            <h2 id="modal-title"></h2>
            <p class="modal-time">⏱️ 所要時間: <span id="modal-time-val"></span>分</p>
            <p id="modal-summary" class="modal-desc"></p>
            <div class="modal-source">
                出典: <span id="modal-source-name"></span>
            </div>
            <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-external">公式・外部サイトで確認する ↗</a>
        </div>
    </div>

    <!-- パスワード認証モーダル（LINE用） -->
    <div id="password-modal" class="modal">
        <div class="modal-content password-box">
            <span class="close-btn" id="pw-close">&times;</span>
            <h2>🔒 セキュリティ認証</h2>
            <p id="pw-question">パスワード質問</p>
            <input type="text" id="pw-input" placeholder="答えをひらがなで入力">
            <button id="pw-submit" class="btn-primary">認証してLINEを開く</button>
            <p id="pw-error" class="error-text"></p>
        </div>
    </div>

    <script src="/Bousai-of-Kurosawa-portal/js/data.js"></script>
<script src="/Bousai-of-Kurosawa-portal/js/app.js"></script>
</body>
</html>
